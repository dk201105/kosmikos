# /etc/nginx/sites-available/kosmikos
# Replace kosmikos.example with your domain. See DEPLOY.md, step 2.

# HTTP: only used for the Let's Encrypt challenge and to redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name kosmikos.example;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kosmikos.example;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kosmikos.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kosmikos.example/privkey.pem;

    # Based on Mozilla's "intermediate" profile (TLS 1.2 + 1.3).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KosmikosSSL:10m;
    ssl_session_tickets off;

    # 2 years. Only add "; preload" once you're sure every subdomain is HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 11m;   # app allows 10MB uploads
    autoindex off;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;          # needed by the app's CSRF check
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, don't append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;        # needed for the Secure cookie
        proxy_read_timeout 60s;
    }
}
