<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="home.css">
    <title>Home - Kosmikos</title>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="Kosmikos">
                <span>Kosmikos</span>
            </div>
            <ul>
                <li><a href="/about-us">About Us</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><form action="/logout" method="POST" class="logout-form"><button type="submit" class="logout-btn">Logout</button></form></li>
            </ul>
        </nav>
        <h1>Your Kosmos</h1>
        <p>See what your friends are up to!</p>
    </header>
    
    <main>
        <section class="post-options">
            <button class="post-btn" data-toggle-form="text-form">Text</button>
            <button class="post-btn" data-toggle-form="image-form">Image</button>
            <button class="post-btn" data-toggle-form="video-form">Video</button>
            <button class="post-btn" data-toggle-form="audio-form">Audio</button>
        </section>

        <!-- Post Forms -->
        <section class="post-forms">
            <form id="text-form" class="post-form hidden">
                <h3>Create a Text Post</h3>
                <textarea id="text-content" placeholder="Write something..."></textarea>
                <button type="button" data-post-type="text">Post</button>
            </form>

            <form id="image-form" class="post-form hidden">
                <h3>Upload an Image</h3>
                <input type="file" id="image-content" accept="image/*">
                <button type="button" data-post-type="image">Post</button>
            </form>

            <form id="video-form" class="post-form hidden">
                <h3>Upload a Video</h3>
                <input type="file" id="video-content" accept="video/*">
                <button type="button" data-post-type="video">Post</button>
            </form>

            <form id="audio-form" class="post-form hidden">
                <h3>Upload an Audio File</h3>
                <input type="file" id="audio-content" accept="audio/*">
                <button type="button" data-post-type="audio">Post</button>
            </form>
        </section>

        <!-- Feed -->
        <section class="search-bar">
            <input type="text" id="search-input" placeholder="Search users...">
            <div class="search-results" id="search-results"></div>
        </section>
        
        <section class="feed">
            <h2>Posts from People You Might Know</h2>
            <div id="posts-feed"></div>
        </section>
    </main>

    <script src="/home.js"></script>
</body>
</html>
