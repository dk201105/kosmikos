<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Kosmikos</title>
    <link rel="stylesheet" href="/profile.css">
    <link rel="stylesheet" href="/home.css"> <!-- Ensures same styling as home page -->
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="/images/logo.png" alt="Kosmikos Logo">
                <span>Kosmikos</span>
            </div>
            <ul>
                <li><a href="/home">Home</a></li>
                <li><a href="/about-us">About Us</a></li>
                <li><form action="/logout" method="POST" class="logout-form"><button type="submit" class="logout-btn">Logout</button></form></li>
            </ul>
        </nav>
    </header>

    <main class="profile-main">
        <!-- Profile Display Section -->
        <section id="profile-display">
            <div class="profile-container">
                <img src="/images/default_profile_pic.jpg" alt="Profile Picture" id="profile-pic">
                <div class="profile-text">
                    <h2 id="user-name">User Name</h2>
                    <p id="user-bio">User bio will appear here...</p>
                </div>
            </div>
        </section>

        <!-- User Posts Section -->
        <section class="feed">
            <h2>Posts</h2>
            <div id="posts-feed"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Kosmikos. All rights reserved.</p>
    </footer>

    <script src="/user_profile.js"></script>
</body>
</html>
